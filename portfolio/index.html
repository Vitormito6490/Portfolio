<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio - Vitor Miguel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="topbar" aria-label="Navegação principal">
        <a href="#menu" class="topbar__link">Menu</a>
        <a href="#skills" class="topbar__link">Skills</a>
        <a href="#projetos" class="topbar__link">Projetos</a>
        <a href="#japao" class="topbar__link">Contato</a>
        <button class="theme-toggle" type="button" aria-label="Ativar modo escuro">
            <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
        </button>
    </nav>
    
    <!-- 1. CÉU/menu -->
    <section class="menu" id="menu">

            <img class = "sol" src="imgs/sol.png" alt="">

            <img class="nuvem1" src="imgs/nuvem1.png" alt="">
            <img class="nuvem2" src="imgs/nuvem2.png" alt="">
            <img class="nuvem3" src="imgs/nuvem3.png" alt="">

        <div class="titulo">
            <h1>Vitor<br>Miguel</h1>
            <p>Programador Back-End</p>
        </div>

        <div class="horizonte">
            <img src="imgs/arvores.png" alt="">
        </div>
    </section>

    
<!-- 2. TERRA / SKILLS -->
<section class="skills" id="skills">
    
    
    
    

    <div class="titulo-secao texto-barra">
        <h2>Skills / Terra</h2>
    </div>

    <div class="flexquadrado">
        
        <a class="skill-link" href="#skill-modal" data-modal-target="skill-modal" data-modal-image="imgs/Oak_Sign_JE3.png" data-modal-alt="Oak Sign" data-modal-text="Desenvolvimento da lógica, processamento de dados e regras do sistema." aria-label="Ver detalhes sobre Back-end">
            <span class="skill-card-text">Back-End</span>
            <div class="skill-card">
                <img class="skill-card__label" src="imgs/Oak_Sign_JE3.png" alt="Oak Sign - Back-end">
            </div>
        </a>
        <a class="skill-link" href="#skill-modal" data-modal-target="skill-modal" data-modal-image="imgs/Oak_Sign_JE3.png" data-modal-alt="Oak Sign" data-modal-text="Consultas, manipulação e organização de informações no banco de dados." aria-label="Ver detalhes sobre Banco de dados">
            <span class="skill-card-text">Banco de Dados</span>
            <div class="skill-card">
                <img class="skill-card__label" src="imgs/Oak_Sign_JE3.png" alt="Oak Sign - Banco de dados">
            </div>
        </a>
        <a class="skill-link" href="#skill-modal" data-modal-target="skill-modal" data-modal-image="imgs/Oak_Sign_JE3.png" data-modal-alt="Oak Sign" data-modal-text="Estruturação e organização de conteúdos de páginas." aria-label="Ver detalhes sobre APIs">
            <span class="skill-card-text">HTML</span>
            <div class="skill-card">
                <img class="skill-card__label" src="imgs/Oak_Sign_JE3.png" alt="Oak Sign - APIs">
            </div>
        </a>
        <a class="skill-link" href="#skill-modal" data-modal-target="skill-modal" data-modal-image="imgs/Oak_Sign_JE3.png" data-modal-alt="Oak Sign" data-modal-text="Estilização visual, layouts e adaptação de telas." aria-label="Ver detalhes sobre Lógica">
            <span class="skill-card-text">CSS</span>
            <div class="skill-card">
                <img class="skill-card__label" src="imgs/Oak_Sign_JE3.png" alt="Oak Sign - Lógica">
            </div>
        </a>
    </div>
</section>
</section>
    <!-- 3. SUBSOLO -->
    <section class="subsolo" id="projetos" aria-labelledby="projetos-titulo">
        <div class="titulo-secao subsolo__header">
            <h2 id="projetos-titulo">Projetos / Subsolo</h2>
        </div>
        <div class="projetos-container" data-projetos-container></div>
    </section>

    <div class="projetos-modal" id="projetos-modal" role="dialog" aria-modal="true" aria-labelledby="projetos-modal-titulo" hidden>
        <section class="projetos-modal__painel" tabindex="-1">
            <button class="projetos-modal__fechar" type="button" aria-label="Fechar detalhes do projeto">&times;</button>
            <p class="projetos-modal__profundidade"></p>
            <h2 id="projetos-modal-titulo"></h2>
            <p class="projetos-modal__descricao"></p>
            <h3>Tecnologias</h3>
            <ul class="projetos-modal__techs"></ul>
            <a class="projetos-modal__link" hidden target="_blank" rel="noopener noreferrer">Acessar projeto</a>
            <p class="projetos-modal__sem-link" hidden>Link do projeto em breve.</p>
        </section>
    </div>

    <!-- 4. JAPÃO (RODAPÉ) -->
    <section class="japao" id="japao">
        <div class="titulo-secao">
            <h2>Contato / Japão</h2>
            <p style="font-size: 50%;">O outro lado do mundo</p>
        </div>

        <form class="contato-form" id="contact-form" aria-describedby="contact-status">
            <div class="contato-form__campo">
                <label for="contact-name">Nome</label>
                <input id="contact-name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="contato-form__campo">
                <label for="contact-email">E-mail</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="contato-form__campo">
                <label for="contact-message">Mensagem</label>
                <textarea id="contact-message" name="message" rows="5" required></textarea>
            </div>
            <button class="contato-form__submit" type="submit">Enviar mensagem</button>
            <p class="contato-form__status" id="contact-status" role="status" aria-live="polite"></p>
        </form>
        
        <footer>
            <p id="footer-text">Vitor Miguel 2026</p>
        </footer>
    </section>

    <!-- MODAL -->
    <div class="modal" id="skill-modal" role="dialog" aria-modal="true" hidden>
        <div class="modal__content">
            <div class="modal__oak">
                <img class="modal__oak-image" src="imgs/oak_hsing.png" alt="Placa de madeira">
                <div class="modal__text">
                    <p data-modal-text></p>
                </div>
            </div>
            <button class="modal__close" type="button" data-modal-close aria-label="Concluído, fechar detalhes">
                <img src="imgs/concluido.png" alt="Concluído">
            </button>
        </div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/nuvem.js"></script>
    <script src="js/tema.js"></script>
    <script src="js/projetos.js"></script>
    <script src="js/contato.js"></script>
    
</body>
</html>
